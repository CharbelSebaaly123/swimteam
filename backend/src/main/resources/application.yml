spring:
  application:
    name: swimteam-api
  datasource:
    url: jdbc:h2:mem:swimteam;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

app:
  jwt:
    secret: swimteam-dev-secret-key-change-in-production-must-be-long-enough-256bits
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  admin:
    username: admin
    password: admin123
    email: coach@swimteam.local
